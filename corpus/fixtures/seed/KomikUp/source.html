    <style>
        :root { 
            --primary: #ff4757; 
            --primary-hover: #ff6b81;
            --bg: #0d0f12; 
            --surface: #15181e; 
            --surface-hover: #1c2028; 
            --card: #13161c; 
            --text: #e6edf3; 
            --text-muted: #8c95a2; 
            --border: #21262d; 
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-soft: 0 4px 16px rgba(0, 0, 0, 0.45);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding-bottom: 75px; 
            min-height: 100vh; 
            line-height: 1.5; 
            -webkit-font-smoothing: antialiased;
        }
        a { text-decoration: none; color: inherit; transition: 0.15s ease; cursor: pointer; }

        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }

        .svg-icon {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            display: inline-block;
            vertical-align: middle;
            flex-shrink: 0;
        }

        /* HEADER */
        header { 
            background: rgba(13, 15, 18, 0.88); 
            padding: 12px 0; 
            border-bottom: 1px solid var(--border); 
            backdrop-filter: blur(14px); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            transition: transform 0.25s ease;
        }
        header.header-hidden { transform: translateY(-100%); }
        .nav-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 16px; 
        }
        .logo { 
            font-size: 18px; 
            font-weight: 800; 
            color: var(--primary); 
            letter-spacing: -0.3px; 
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .nav-menu { display: flex; gap: 6px; align-items: center; flex: 1; min-width: 0; }
        .nav-menu a { 
            font-size: 13px; 
            font-weight: 600; 
            color: var(--text-muted); 
            padding: 8px 12px; 
            border-radius: var(--radius-sm);
            white-space: nowrap; 
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-menu a:hover { color: #fff; background: var(--surface); }
        .nav-menu a.active { color: #fff; background: var(--surface); border: 1px solid var(--border); }

        .search-item { position: relative; flex: 1; min-width: 150px; max-width: 100%; }
        .search-input { 
            width: 100%; 
            background: var(--surface); 
            border: 1px solid var(--border); 
            color: #fff; 
            padding: 8px 14px 8px 34px; 
            border-radius: var(--radius-sm); 
            font-size: 13px; 
            outline: none; 
            transition: border-color 0.2s ease, background 0.2s ease;
        }
        .search-input:focus { border-color: var(--primary); background: #191c24; }
        .search-icon-pos {
            position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); pointer-events: none;
        }

        /* AUTH NAV & USER BADGE */
        .auth-nav-box { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .btn-auth-header {
            background: var(--primary); color: #fff; padding: 7px 14px;
            border-radius: var(--radius-sm); font-size: 12px; font-weight: 700;
            display: inline-flex; align-items: center; gap: 6px; border: none; cursor: pointer;
        }
        .btn-auth-header:hover { background: var(--primary-hover); }

        .user-profile-badge {
            display: flex; align-items: center; gap: 8px; background: var(--surface);
            border: 1px solid var(--border); padding: 4px 10px 4px 6px;
            border-radius: 50px; font-size: 12px; font-weight: 600;
        }
        .user-avatar {
            width: 26px; height: 26px; border-radius: 50%; background: var(--primary);
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 800; overflow: hidden;
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .level-chip {
            background: rgba(255, 71, 87, 0.15); color: var(--primary);
            font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px;
            border: 1px solid rgba(255, 71, 87, 0.3); text-transform: uppercase;
        }

        .menu-toggle-btn {
            display: none; background: var(--surface); border: 1px solid var(--border);
            color: var(--text); padding: 8px 12px; border-radius: var(--radius-sm); cursor: pointer;
        }

        /* SECTION TITLE */
        .section-title { 
            font-size: 16px; font-weight: 700; margin: 26px 0 16px; 
            display: flex; align-items: center; gap: 10px;
            letter-spacing: -0.2px; color: var(--text);
        }
        .section-title::before {
            content: ""; display: inline-block; width: 4px; height: 16px;
            background: var(--primary); border-radius: 2px;
        }

        /* GRID & CARDS */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 16px; }
        .card { 
            background: var(--card); border-radius: var(--radius-md); overflow: hidden; 
            position: relative; border: 1px solid var(--border); display: flex; 
            flex-direction: column; transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .card:hover { transform: translateY(-3px); border-color: #30363d; box-shadow: var(--shadow-soft); }

        .card-link { display: block; position: relative; padding-top: 142%; overflow: hidden; background: #15181e; }
        .card-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.25s ease; }
        .card:hover .card-img { transform: scale(1.03); }

        .badge-type { 
            position: absolute; top: 8px; left: 8px; padding: 3px 8px; 
            font-size: 10px; font-weight: 700; border-radius: 4px; 
            text-transform: uppercase; letter-spacing: 0.3px; backdrop-filter: blur(6px); z-index: 2; 
        }
        .Manhwa { background: rgba(52, 152, 219, 0.85); color: #fff; } 
        .Manhua { background: rgba(155, 89, 182, 0.85); color: #fff; } 
        .Manga { background: rgba(255, 71, 87, 0.9); color: #fff; }

        .card-info { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .card-title { 
            font-size: 13.5px; font-weight: 600; line-height: 1.4; color: #f0f6fc; 
            overflow: hidden; text-overflow: ellipsis; display: -webkit-box; 
            -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 2.8em; 
        }
        .card-title:hover { color: var(--primary); }

        .chapter-mini-list { display: flex; flex-direction: column; gap: 5px; margin-top: auto; }
        .chap-chip { 
            display: flex; justify-content: space-between; background: var(--surface); 
            padding: 6px 10px; border-radius: var(--radius-sm); font-size: 11px; 
            color: var(--text-muted); border: 1px solid rgba(255, 255, 255, 0.03); transition: 0.15s;
        }
        .chap-chip:hover { color: #fff; border-color: var(--border); }

        .history-banner { 
            background: var(--surface); border: 1px solid var(--border); color: var(--text); 
            padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 18px; 
            display: flex; justify-content: space-between; align-items: center; 
            font-size: 13px; font-weight: 500; 
        }
        .history-banner a { 
            background: var(--primary); color: white; padding: 6px 14px; 
            border-radius: 6px; font-weight: 600; font-size: 12px;
        }

        /* READER UI */
        .reader-header, .reader-footer { display: none; }
        body.reader-mode header { display: none !important; }
        .reader-container { width: 100%; max-width: 800px; margin: 0 auto; background: #000; min-height: 100vh;}
        .reader-container img { 
            width: 100% !important; height: auto !important; display: block; 
            background: #111; margin: 0 !important; padding: 0 !important; 
            border: none !important; vertical-align: bottom; 
        }

        body.reader-mode .reader-header, body.reader-mode .reader-footer {
            display: flex; position: fixed; left: 0; right: 0; background: rgba(13, 15, 18, 0.94); 
            z-index: 9999; backdrop-filter: blur(12px); transition: opacity 0.25s ease; 
            opacity: 0; pointer-events: none;
        }
        body.reader-mode .reader-header.show, body.reader-mode .reader-footer.show { 
            opacity: 1; pointer-events: auto; 
        }

        .reader-header { 
            top: 0; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border); height: 56px; padding: 0 16px;
        }
        #readerTitle {
            font-size: 14px; font-weight: 700; color: #fff; max-width: 65%; 
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: center;
        }

        .reader-footer { 
            bottom: 0; justify-content: space-between; align-items: center; 
            border-top: 1px solid var(--border); height: 64px; padding: 0 16px; gap: 12px;
        }

        .nav-action-btn {
            background: var(--surface); border: 1px solid var(--border); color: #fff; 
            height: 44px; padding: 0 16px; border-radius: var(--radius-sm); cursor: pointer; 
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; 
            font-size: 13px; font-weight: 600; user-select: none;
        }
        .nav-action-btn:hover { border-color: var(--primary); color: var(--primary); background: #1a1e26; }
        .nav-action-btn.center-btn { flex: 1; max-width: 220px; background: var(--surface-hover); }

        .control-btn-icon {
            background: var(--surface); border: 1px solid var(--border); color: #fff; 
            cursor: pointer; width: 40px; height: 40px; border-radius: var(--radius-sm); 
            display: flex; align-items: center; justify-content: center;
        }
        .control-btn-icon:hover { border-color: var(--primary); color: var(--primary); }

        /* BOTTOM SHEET */
        .bottom-sheet { 
            position: fixed; bottom: -100%; left: 50%; transform: translateX(-50%); 
            width: 100%; max-width: 580px; background: #14171d; z-index: 10000; 
            border-radius: 16px 16px 0 0; transition: bottom 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
            max-height: 75vh; display: flex; flex-direction: column; border: 1px solid var(--border); border-bottom: none;
        }
        .bottom-sheet.active { display: flex !important; bottom: 0 !important; }
        .overlay-bg.active { display: block !important; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 9998; }

        .sheet-header { padding: 16px 18px 14px; border-bottom: 1px solid var(--border); background: #14171d; position: sticky; top: 0; z-index: 2; border-radius: 16px 16px 0 0; }
        .sheet-title { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 10px; text-align: center; }
        .sheet-search { width: 100%; background: var(--surface); border: 1px solid var(--border); color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 13px; outline: none; }
        .sheet-search:focus { border-color: var(--primary); background: #1a1e26; }

        #sheetContent { overflow-y: auto; flex-grow: 1; padding: 12px 16px 30px; }
        .sheet-chapter-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 14px; margin-bottom: 8px; background: var(--surface); 
            border-radius: 8px; border: 1px solid var(--border); font-size: 13.5px; 
            font-weight: 600; color: #d1d7e0; min-height: 44px;
        }
        .sheet-chapter-item:hover { background: #1c2028; color: #fff; border-color: #3b4150; }
        .sheet-chapter-item.current-active { background: rgba(255, 71, 87, 0.12); color: var(--primary); border-color: var(--primary); }
        .sheet-chapter-item.current-active::after { content: "Sedang Dibaca"; font-size: 10px; background: var(--primary); color: #fff; padding: 3px 8px; border-radius: 4px; font-weight: 700; }
        .sheet-chapter-item.already-read { background: #0b0d10; color: #666; border-color: #161a20; opacity: 0.8; }

        /* DETAIL WRAPPER & CHAPTER CARDS */
        .detail-wrap { 
            display: flex; gap: 28px; background: var(--card); padding: 28px; 
            border-radius: var(--radius-lg); margin-top: 20px; border: 1px solid var(--border); 
        }
        .detail-cover { 
            width: 190px; height: 275px; border-radius: var(--radius-md); object-fit: cover; 
            background: #1a1e26; box-shadow: var(--shadow-soft); flex-shrink: 0;
        }
        .detail-text h1 { font-size: 20px; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.3px; line-height: 1.35; }
        .meta-info { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .meta-tag { 
            background: var(--surface); padding: 4px 10px; border-radius: 6px; 
            border: 1px solid var(--border); font-size: 12px; color: var(--text-muted); 
            display: flex; align-items: center; gap: 5px;
        }

        .btn-bookmark { 
            background: var(--surface); border: 1px solid var(--border); color: #fff; 
            padding: 9px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; 
            font-size: 13px; margin-bottom: 14px; transition: all 0.15s ease;
            display: inline-flex; align-items: center; gap: 7px;
        }
        .btn-bookmark:hover { border-color: var(--primary); color: var(--primary); }
        .btn-bookmark.active { background: var(--primary); border-color: var(--primary); color: #fff; }

        .recommendation-title { font-size: 15px; font-weight: 700; border-left: 3px solid var(--primary); padding-left: 10px; margin: 28px 0 14px; }
        
        .chapter-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 10px; margin-top: 14px; }
        .chapter-card { 
            background: var(--surface); padding: 10px 12px; border-radius: var(--radius-sm); 
            text-align: center; border: 1px solid var(--border); font-size: 12px; font-weight: 600; 
            transition: 0.15s ease; min-height: 42px; display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        .chapter-card:hover { background: var(--primary); border-color: var(--primary); color: #fff; }

        /* USER PROFILE DASHBOARD */
        .profile-container { max-width: 800px; margin: 30px auto; display: flex; flex-direction: column; gap: 24px; }
        .profile-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-soft); }
        .profile-header-info { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; }
        .profile-big-avatar { 
            width: 72px; height: 72px; border-radius: 50%; background: var(--primary); 
            color: #fff; display: flex; align-items: center; justify-content: center; 
            font-size: 28px; font-weight: 800; overflow: hidden; border: 2px solid var(--border);
        }
        .profile-big-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .xp-bar-box { background: #101217; border-radius: 10px; height: 12px; width: 100%; overflow: hidden; border: 1px solid var(--border); margin: 8px 0 4px; }
        .xp-bar-fill { background: linear-gradient(90deg, var(--primary), #ffa502); height: 100%; width: 0%; transition: width 0.3s ease; }

        /* COMMENT SECTION STYLES (CHAPTER READER) */
        .comment-section-reader {
            max-width: 800px;
            margin: 40px auto 20px auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
        }
        .comment-input-box { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
        .comment-textarea { 
            width: 100%; background: var(--surface); border: 1px solid var(--border); 
            color: #fff; padding: 12px 14px; border-radius: var(--radius-sm); 
            font-size: 13px; resize: vertical; min-height: 80px; outline: none; font-family: inherit;
        }
        .comment-textarea:focus { border-color: var(--primary); }
        .comment-list { display: flex; flex-direction: column; gap: 12px; }
        .comment-card { 
            background: var(--surface); border: 1px solid var(--border); 
            border-radius: var(--radius-sm); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;
        }
        .comment-header { display: flex; align-items: center; gap: 8px; }
        .comment-user-avatar { 
            width: 30px; height: 30px; border-radius: 50%; background: var(--primary); 
            color: #fff; display: flex; align-items: center; justify-content: center; 
            font-size: 11px; font-weight: 700; overflow: hidden; flex-shrink: 0;
        }
        .comment-user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .comment-body { font-size: 13px; color: var(--text); line-height: 1.5; word-break: break-word; }
        .btn-load-more-comments { 
            background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); 
            padding: 10px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; 
            width: 100%; cursor: pointer; margin-top: 14px;
        }
        .btn-load-more-comments:hover { color: #fff; border-color: var(--primary); }

        /* AUTH FORMS */
        .auth-container { 
            max-width: 420px; margin: 40px auto; background: var(--card); 
            border: 1px solid var(--border); border-radius: var(--radius-lg); 
            padding: 32px 26px; box-shadow: var(--shadow-soft);
        }
        .auth-title { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 6px; text-align: center; }
        .auth-desc { font-size: 12.5px; color: var(--text-muted); text-align: center; margin-bottom: 22px; }
        .auth-form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
        .auth-form-group label { font-size: 12px; font-weight: 600; color: var(--text); }
        .auth-form-input { 
            background: var(--surface); border: 1px solid var(--border); color: #fff; 
            padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; outline: none;
        }
        .auth-form-input:focus { border-color: var(--primary); }
        .btn-auth-submit { 
            background: var(--primary); color: #fff; padding: 12px; border-radius: var(--radius-sm); 
            font-size: 13.5px; font-weight: 700; border: none; cursor: pointer; width: 100%; margin-top: 8px;
        }
        .btn-auth-submit:hover { background: var(--primary-hover); }
        .auth-divider { display: flex; align-items: center; text-align: center; margin: 18px 0; color: var(--text-muted); font-size: 11px; }
        .auth-divider::before, .auth-divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
        .auth-divider:not(:empty)::before { margin-right: .5em; }
        .auth-divider:not(:empty)::after { margin-left: .5em; }
        .btn-google-auth { 
            background: var(--surface); border: 1px solid var(--border); color: #fff; 
            padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; 
            width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
        }
        .btn-google-auth:hover { background: var(--surface-hover); border-color: #3b4252; }
        .auth-footer-links { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 18px; }
        .auth-footer-links a { color: var(--primary); font-weight: 600; }

        /* OFFERWALL & POPUP */
        .offerwall-overlay { 
            background: #14171d; border: 1px solid var(--border); border-radius: var(--radius-lg); 
            padding: 44px 24px; text-align: center; max-width: 520px; width: 90%; 
            margin: 40px auto; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6); 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .offerwall-icon { 
            margin-bottom: 14px; color: var(--primary); display: inline-flex; align-items: center; 
            justify-content: center; width: 64px; height: 64px; background: rgba(255, 71, 87, 0.08); 
            border: 1px solid rgba(255, 71, 87, 0.2); border-radius: 50%;
        }
        .offerwall-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 8px; }
        .offerwall-desc { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; max-width: 380px; }
        .offerwall-btn { 
            background: var(--primary); color: #fff; font-size: 14px; font-weight: 700; 
            padding: 13px 28px; border-radius: var(--radius-sm); border: none; cursor: pointer; 
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 260px;
        }

<script>
    // ==========================================
    // 1. FIREBASE CONFIGURATION
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyDfy87uITLHVVjwHADaXxCpKnc1wJ64NMc",
        authDomain: "komikup-92a55.firebaseapp.com",
        projectId: "komikup-92a55",
        storageBucket: "komikup-92a55.firebasestorage.app",
        messagingSenderId: "294981658434",
        appId: "1:294981658434:web:aa66e3c69d113318b1cadb",
        measurementId: "G-W7BGHZC27Q"
    };

    let auth = null;
    let db = null;
    let currentUser = null;
    let firebaseInitPromise = null; // Menyimpan status loading agar bisa di-await bersama

    function loadScriptAsync(src) {
        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = src;
            script.async = true;
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
        });
    }

    function sanitizeStoredAvatarDomain(user) {
        try {
            // 1. Bersihkan LocalStorage jika masih ada format .co
            const cached = getStorage('komikup_cached_profile');
            if (cached && cached.photoURL && (cached.photoURL.includes('ibb.co/') || cached.photoURL.includes('://ibb.co.com/'))) {
                cached.photoURL = normalizeImgbbUrl(cached.photoURL);
                setStorage('komikup_cached_profile', cached);
            }

            // 2. Perbaiki profil Firebase Auth jika URL akun user masih berdomain .co
            if (user && user.photoURL && (user.photoURL.includes('ibb.co/') || user.photoURL.includes('://ibb.co.com/'))) {
                const fixedUrl = normalizeImgbbUrl(user.photoURL);
                user.updateProfile({ photoURL: fixedUrl }).catch(() => {});
                
                if (typeof db !== 'undefined' && db) {
                    db.collection('users').doc(user.uid).set({
                        photoURL: fixedUrl
                    }, { merge: true }).catch(() => {});
                }
            }
        } catch (e) {
            console.warn("Gagal sanitasi avatar domain:", e);
        }
    }

    function initFirebase() {
        // Jika sudah siap, langsung resolve
        if (auth && db) return Promise.resolve(true);

        // Jika sedang proses unduh, kembalikan antrean promise yang sama
        if (firebaseInitPromise) return firebaseInitPromise;

        firebaseInitPromise = (async () => {
            try {
                // 1. Muat App Core terlebih dahulu
                await loadScriptAsync("https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js");

                // 2. Muat Auth & Firestore secara paralel
                await Promise.all([
                    loadScriptAsync("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"),
                    loadScriptAsync("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js")
                ]);

                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }

                auth = firebase.auth();
                db = firebase.firestore();

                // 3. Pasang listener auth state
                auth.onAuthStateChanged(async (user) => {
                    currentUser = user;
                    updateHeaderUserInterface(user);

                    if (user) {
                        sanitizeStoredAvatarDomain(user);
                        await syncLocalBookmarksToFirestore(user.uid);
                        await syncUserStatsFromFirestore(user.uid);
                    }
                    updateHeaderUserInterface(user);
                    // Jika user sedang berada di halaman profil, render ulang otomatis
                    const params = new URLSearchParams(window.location.search);
                    if (params.get('page') === 'profile') {
                        renderProfilePage();
                    }
                });

                return true;
            } catch (err) {
                console.warn("Gagal inisialisasi Firebase:", err);
                firebaseInitPromise = null; // Reset agar bisa dicoba ulang bila gagal
                return false;
            }
        })();

        return firebaseInitPromise;
    }

    // Tetap muat di background saat idle
    if ('requestIdleCallback' in window) {
        window.requestIdleCallback(() => initFirebase());
    } else {
        setTimeout(initFirebase, 1500);
    }

    function getStorage(key) { return JSON.parse(localStorage.getItem(key) || '{}'); }
    function setStorage(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

    // ==========================================
    // 2. LEVELING & READING STATS (BACA LANGSUNG DARI KOMIKUP_HISTORY)
    // ==========================================
    function calculateUserLevel(xp = 0) {
        const level = Math.floor(Math.sqrt(xp / 10)) + 1;
        const currentLevelBaseXP = Math.pow(level - 1, 2) * 10;
        const nextLevelBaseXP = Math.pow(level, 2) * 10;
        const progressPercent = Math.min(100, Math.max(0, ((xp - currentLevelBaseXP) / (nextLevelBaseXP - currentLevelBaseXP)) * 100));
        return {
            level: level,
            xp: xp,
            progress: Math.round(progressPercent),
            nextXP: nextLevelBaseXP
        };
    }

    function getReadChaptersList() {
        return JSON.parse(localStorage.getItem('komikup_read_chapters') || '[]');
    }

    // Membaca langsung riwayat komikup_history di localStorage
    function getUserStats() {
        const readList = getReadChaptersList();
        const savedStats = getStorage('komikup_user_stats');

        // Total membaca diambil dari jumlah riwayat unik chapter ATAU nilai tertinggi yang tersimpan
        const totalChapters = Math.max(readList.length, savedStats.chaptersRead || 0);
        const totalXP = totalChapters * 10;

        return {
            xp: totalXP,
            chaptersRead: totalChapters
        };
    }

    // Tambah XP hanya jika chapter ini belum pernah dibaca sebelumnya
    function addReadingExperience(comicId, chapEp) {
        const cleanEp = cleanEndpoint(chapEp);
        let readList = getReadChaptersList();

        // Cek apakah chapter ini benar-benar belum pernah dibuka
        if (!readList.includes(cleanEp)) {
            readList.push(cleanEp);
            localStorage.setItem('komikup_read_chapters', JSON.stringify(readList));

            // Hitung ulang statistik secara instan
            const newTotalRead = Math.max(readList.length, (getUserStats().chaptersRead + 1));
            const newStats = {
                chaptersRead: newTotalRead,
                xp: newTotalRead * 10
            };

            setStorage('komikup_user_stats', newStats);
            localStorage.setItem('komikup_pending_stats_sync', 'true');
        }

        // Langsung perbarui UI di layar
        if (currentUser) {
            updateHeaderUserInterface(currentUser);
        }
    }

    function recalculateExistingHistory() {
        let readList = getReadChaptersList();
        const historyObj = getStorage('komikup_history');

        // Kumpulkan semua chapter dari komikup_history jika belum ada di komikup_read_chapters
        let updated = false;
        Object.values(historyObj).forEach(item => {
            if (item && item.ep) {
                const ep = cleanEndpoint(item.ep);
                if (!readList.includes(ep)) {
                    readList.push(ep);
                    updated = true;
                }
            }
        });

        if (updated) {
            localStorage.setItem('komikup_read_chapters', JSON.stringify(readList));
        }

        // Perbarui stats berdasarkan akumulasi yang valid
        const currentStats = getStorage('komikup_user_stats');
        const finalChapters = Math.max(readList.length, currentStats.chaptersRead || 0);
        
        setStorage('komikup_user_stats', {
            chaptersRead: finalChapters,
            xp: finalChapters * 10
        });
    }

    // Jalankan rekalkulasi saat script dimuat
    recalculateExistingHistory();

    async function flushPendingStatsToFirestore() {
        if (!currentUser || !db) return;
        const hasPending = localStorage.getItem('komikup_pending_stats_sync');
        if (!hasPending) return;

        try {
            const stats = getUserStats();
            const userLevelInfo = calculateUserLevel(stats.xp);

            // Simpan hanya angka ringkasan ke Firestore (ukuran < 100 bytes)
            await db.collection('users').doc(currentUser.uid).set({
                xp: stats.xp,
                level: userLevelInfo.level,
                chaptersRead: stats.chaptersRead,
                lastActive: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            // Pastikan local storage konsisten dengan apa yang dikirim ke cloud
            setStorage('komikup_user_stats', stats);
            localStorage.removeItem('komikup_pending_stats_sync');
        } catch (e) {
            console.warn("Gagal flush stats:", e);
        }
    }

    async function syncUserStatsFromFirestore(uid) {
        if (!db) return;
        try {
            const doc = await db.collection('users').doc(uid).get();
            const localStats = getUserStats();

            if (doc.exists) {
                const cloudData = doc.data();
                const cloudXP = cloudData.xp || 0;
                const cloudRead = cloudData.chaptersRead || 0;

                // Jika data lokal lebih tinggi dari cloud (user baru selesai baca offline/sebelum sync)
                if (localStats.xp > cloudXP) {
                    localStorage.setItem('komikup_pending_stats_sync', 'true');
                    await flushPendingStatsToFirestore();
                } else {
                    // Jika data di cloud lebih tinggi (misal habis baca di perangkat lain)
                    setStorage('komikup_user_stats', {
                        xp: cloudXP,
                        chaptersRead: cloudRead
                    });
                }
            } else {
                // Dokumen user baru, unggah stats lokal pertama kali
                localStorage.setItem('komikup_pending_stats_sync', 'true');
                await flushPendingStatsToFirestore();
            }

            updateHeaderUserInterface(currentUser);
        } catch (e) {
            console.warn("Gagal sync user stats:", e);
        }
    }

    function updateHeaderUserInterface(user) {
        const container = document.getElementById('headerAuthContainer');
        if (!container) return;

        const stats = getUserStats();
        const levelInfo = calculateUserLevel(stats.xp);

        if (user) {
            const cachedProfile = getStorage('komikup_cached_profile');
            const displayName = user.displayName || cachedProfile.displayName || user.email.split('@')[0];
            const photo = user.photoURL || cachedProfile.photoURL || '';
            const initial = displayName.charAt(0).toUpperCase();
            
            const avatarHtml = photo 
                ? `<img src="${photo}" alt="${displayName}">`
                : initial;

            container.innerHTML = `
                <a href="?page=profile" class="user-profile-badge" title="Lihat Profil & Level">
                    <div class="user-avatar">${avatarHtml}</div>
                    <span style="max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${displayName}</span>
                    <span class="level-chip">Lv.${levelInfo.level}</span>
                </a>
            `;
        } else {
            container.innerHTML = `

    async function syncLocalBookmarksToFirestore(uid) {
        try {
            const userDocRef = db.collection('users').doc(uid);
            const doc = await userDocRef.get();

            let cloudBookmarks = {};
            if (doc.exists && doc.data().bookmarks) {
                cloudBookmarks = doc.data().bookmarks;
            }

            const localBookmarks = getStorage('komikup_bookmarks');
            const mergedBookmarks = { ...cloudBookmarks, ...localBookmarks };

            await userDocRef.set({
                bookmarks: mergedBookmarks,
                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            setStorage('komikup_bookmarks', mergedBookmarks);

            const params = new URLSearchParams(window.location.search);
            if (params.get('page') === 'bookmarks') {
                renderBookmarkPage();
            }
        } catch (err) {
            console.warn("Gagal sinkronisasi bookmark:", err);
        }
    }

    async function toggleBookmark(comicData) {
        let bookmarks = getStorage('komikup_bookmarks');
        if (bookmarks[comicData.id]) {
            delete bookmarks[comicData.id];
        } else {
            bookmarks[comicData.id] = comicData;
        }
        setStorage('komikup_bookmarks', bookmarks);

        if (currentUser && db) {
            try {
                await db.collection('users').doc(currentUser.uid).set({
                    bookmarks: bookmarks,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            } catch (e) {
                console.warn("Gagal simpan bookmark cloud:", e);
            }
        }

        fetchDetail(comicData.id); 
    }

   // GANTI DENGAN API KEY ANDA DARI api.imgbb.com
    const IMGBB_API_KEY = "d689ec8542c1249a14a3077a8e2970cf";

  function normalizeImgbbUrl(url) {
    if (!url || typeof url !== 'string') return '';
    let clean = url.trim();

    // 1. Ubah domain landing page (ibb.co / ibb.co.com) ke direct image (i.ibb.co.com)
    clean = clean.replace(/:\/\/(i\.)?ibb\.co\//gi, '://i.ibb.co.com/');
    clean = clean.replace(/:\/\/ibb\.co\.com\//gi, '://i.ibb.co.com/');

    return clean;
}

async function handleUpdateProfile(e) {
    e.preventDefault();
    if (!currentUser) return;

    const newName = document.getElementById('editUsernameInput').value.trim();
    const avatarFile = document.getElementById('editAvatarInput').files[0];
    const btn = document.getElementById('btnSaveProfile');
    const progressText = document.getElementById('uploadProgressText');

    btn.disabled = true;
    btn.innerText = "Menyimpan...";

    // Ambil URL lama dan normalisasi langsung jika masih berformat .co
    let uploadedPhotoUrl = normalizeImgbbUrl(currentUser.photoURL || '');

    try {
        // 1. Upload ke ImgBB jika ada file gambar dipilih
        if (avatarFile) {
            if (avatarFile.size > 2 * 1024 * 1024) {
                throw new Error("Ukuran foto maksimal 2 MB!");
            }

            if (progressText) progressText.innerText = "Mengunggah foto...";

            const formData = new FormData();
            formData.append('image', avatarFile);

            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: 'POST',
                body: formData
            });

            const result = await response.json();
            if (!result.success || !result.data) {
                throw new Error(result.error ? result.error.message : "Gagal mengunggah foto.");
            }

            // Prioritaskan file gambar langsung (direct file)
            let directImageUrl = '';
            if (result.data.image && result.data.image.url) {
                directImageUrl = result.data.image.url;
            } else if (result.data.display_url) {
                directImageUrl = result.data.display_url;
            } else {
                directImageUrl = result.data.url || '';
            }

            // Normalisasi URL hasil upload baru ke i.ibb.co.com
            uploadedPhotoUrl = normalizeImgbbUrl(directImageUrl);
        }

        // 2. Simpan ke Firebase Auth Profile
        await currentUser.updateProfile({
            displayName: newName,
            photoURL: uploadedPhotoUrl
        });

        // 3. Simpan ke Firestore users collection
        if (typeof db !== 'undefined' && db) {
            await db.collection('users').doc(currentUser.uid).set({
                displayName: newName,
                photoURL: uploadedPhotoUrl,
                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
        }

        // 4. Update LocalStorage Cache (Bersihkan juga data yang sudah ada sebelumnya)
        let cachedUser = getStorage('komikup_cached_profile') || {};
        cachedUser.displayName = newName;
        cachedUser.photoURL = uploadedPhotoUrl;
        setStorage('komikup_cached_profile', cachedUser);

        if (progressText) progressText.innerText = "";
        alert("Profil dan foto berhasil diperbarui!");

        updateHeaderUserInterface(currentUser);
        renderProfilePage();

    } catch (err) {
        console.error("Gagal update profil:", err);
        alert("Terjadi kesalahan: " + err.message);
    } finally {
        btn.disabled = false;
        btn.innerText = "Simpan Perubahan";
        if (progressText) progressText.innerText = "";
    }
}

    let lastCommentDoc = null;
    let activeCommentKey = null;

    async function loadInitialComments(key) {
        activeCommentKey = key;
        lastCommentDoc = null;
        const commentList = document.getElementById('commentList');
        const loadMoreBtn = document.getElementById('btnLoadMoreComments');
        if (!commentList) return;

        await initFirebase();
        if (!db) {
            commentList.innerHTML = `<p style="color: var(--text-muted); font-size: 12px;">Fitur komentar sedang dimuat...</p>`;
            return;
        }

        try {
            const snapshot = await db.collection('comments')
                .where('key', '==', key)
                .limit(5)
                .get();

            if (snapshot.empty) {
                commentList.innerHTML = `<p style="color: var(--text-muted); font-size: 12.5px;">Belum ada komentar untuk chapter ini. Tulis tanggapanmu!</p>`;
                if (loadMoreBtn) loadMoreBtn.style.display = 'none';
                return;
            }

            lastCommentDoc = snapshot.docs[snapshot.docs.length - 1];
            commentList.innerHTML = '';
            
            const comments = [];
            snapshot.forEach(doc => {
                const d = doc.data();
                d._id = doc.id;
                comments.push(d);
            });
            comments.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); 
            comments.forEach(data => appendCommentToDOM(data, data._id));

            if (loadMoreBtn) {
                loadMoreBtn.style.display = snapshot.docs.length === 5 ? 'block' : 'none';
            }
        } catch (err) {
            console.warn("Gagal memuat komentar:", err);
            commentList.innerHTML = `<p style="color: var(--text-muted); font-size: 12px;">Gagal memuat komentar.</p>`;
        }
    }

    async function loadMoreComments() {
        if (!lastCommentDoc || !activeCommentKey || !db) return;
        const loadMoreBtn = document.getElementById('btnLoadMoreComments');
        loadMoreBtn.innerText = "Memuat...";

        try {
            const snapshot = await db.collection('comments')
                .where('key', '==', activeCommentKey)
                .startAfter(lastCommentDoc)
                .limit(5)
                .get();

            if (snapshot.empty) {
                loadMoreBtn.style.display = 'none';
                return;
            }

            lastCommentDoc = snapshot.docs[snapshot.docs.length - 1];
            const comments = [];
            snapshot.forEach(doc => comments.push(doc.data()));
            comments.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

            comments.forEach(data => appendCommentToDOM(data));

            loadMoreBtn.innerText = "Muat Lebih Banyak";
            if (snapshot.docs.length < 5) {
                loadMoreBtn.style.display = 'none';
            }
        } catch (e) {
            loadMoreBtn.innerText = "Gagal memuat";
        }
    }

    async function submitReply(parentId, targetUserName) {
        const input = document.getElementById(`reply-input-${parentId}`);
        const text = input ? input.value.trim() : '';
        if (!text || !activeCommentKey) return;

        const activeUser = currentUser || auth.currentUser;
        if (!activeUser) return;

        try {
            await initFirebase();
            const stats = getUserStats();
            const levelInfo = calculateUserLevel(stats.xp);

            const replyData = {
                key: activeCommentKey,
                userId: activeUser.uid,
                userName: activeUser.displayName || activeUser.email.split('@')[0],
                userAvatar: activeUser.photoURL || '',
                userLevel: levelInfo.level,
                text: text,
                replyTo: targetUserName,
                parentId: parentId,
                createdAt: Date.now()
            };

            await db.collection('comments').add(replyData);
            input.value = '';
            document.getElementById(`reply-box-${parentId}`).style.display = 'none';
            appendCommentToDOM(replyData);
        } catch (err) {
            alert("Gagal membalas: " + err.message);

    }

    function router() {
        const params = new URLSearchParams(window.location.search);
        const q = params.get('q');
        const ep = params.get('ep');
        const page = params.get('page');
        const type = params.get('type');
        const huruf = params.get('huruf') || params.get('h') || '';
        const p = params.get('p') || params.get('page_num') || 1;

        cleanupReaderMode();
        document.querySelectorAll('.nav-menu a').forEach(a => a.classList.remove('active'));
        document.getElementById('navMenu')?.classList.remove('open');

        flushPendingStatsToFirestore();

        if (applyKcopaLock()) return;

        if (q) {
            fetchSearch(q);
        } else if (page === 'login') {
            renderLoginPage();
        } else if (page === 'register') {
            renderRegisterPage();
        } else if (page === 'profile') {
            document.getElementById('menu-profile')?.classList.add('active');
            renderProfilePage();
        } else if (page === 'bookmarks') { 
            document.getElementById('menu-bookmarks')?.classList.add('active'); 
            renderBookmarkPage(); 
        } else if (page === 'type') { 
            const activeNav = document.getElementById(`menu-${type}`);
            if (activeNav) activeNav.classList.add('active');
            fetchType(type, p, huruf); 
        } else if (page === 'detail') {
            fetchDetail(ep);
        } else if (page === 'read') { 
            setupReaderMode(); 
            fetchChapter(ep); 
        } else { 
            document.getElementById('menu-home')?.classList.add('active'); 
            fetchHome(p); 
        }
    }

    async function getData(endpoint) {
        const contentArea = document.getElementById('content-area');
        contentArea.style.opacity = "0.5";
        
        let res = null;
        let usedApi = PRIMARY_API;

        try {
            res = await fetch(PRIMARY_API + endpoint);
            if (!res.ok) throw new Error(`Primary status: ${res.status}`);
            if (isServerImpaired) {
                isServerImpaired = false;
                updateProxyUrl();
            }
        } catch (err) {
            console.warn("API Utama gagal, beralih ke server cadangan...", err);
            isServerImpaired = true;
            updateProxyUrl();
            showServerWarningBanner();

            try {
                usedApi = FALLBACK_API;
                res = await fetch(FALLBACK_API + endpoint);
                if (!res.ok) throw new Error(`Fallback status: ${res.status}`);
            } catch (fallbackErr) {
                console.error("Semua API gagal diakses:", fallbackErr);
                contentArea.style.opacity = "1";
                
                const isReaderActive = document.body.classList.contains('reader-mode') || document.getElementById('readerContainerBox');
                if (isReaderActive) return null;

                contentArea.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; max-width: 440px; margin: 0 auto; color: #fff;">
                        <svg class="svg-icon" style="width: 40px; height: 40px; color: var(--primary); margin-bottom: 12px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                        <h1 style="font-size: 16px; font-weight: 700; margin-bottom: 8px;">Koneksi Server Terputus</h1>
                        <p style="font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-bottom: 18px;">
                            Tidak dapat menjangkau server API. Silakan periksa jaringan dan coba beberapa saat lagi.
                        </p>
                        <button onclick="location.reload()" style="background: var(--primary); color: #fff; border: none; padding: 8px 18px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer;">
                            Muat Ulang Halaman
                        </button>
                    </div>
                `;
                return null;
            }
        }

        try {
            const json = await res.json();
            contentArea.style.opacity = "1";
            return json;
        } catch (jsonErr) {
            console.error("Gagal parse JSON:", jsonErr);
            contentArea.style.opacity = "1";
            return null;
        }
    }

    function updateSEO(title, description, image = "", schemaData = null) {
        document.title = title;
        
        const setMeta = (attr, key, val) => {
            let meta = document.querySelector(`meta[${attr}="${key}"]`);
            if (meta) meta.setAttribute('content', val);
        };

        setMeta('name', 'description', description);
        setMeta('property', 'og:title', title);
        setMeta('property', 'og:description', description);
        
        const canonicalUrl = window.location.href;
        let canonicalTag = document.querySelector('link[rel="canonical"]');
        if (canonicalTag) canonicalTag.setAttribute('href', canonicalUrl);
        setMeta('property', 'og:url', canonicalUrl);

        if (image) {
            setMeta('property', 'og:image', image);
        } else {
            setMeta('property', 'og:image', 'https://www.komikup.com/favicon.ico');
        }

        let canonical = document.querySelector('link[rel="canonical"]');
        if (!canonical) {
            canonical = document.createElement('link');
            canonical.setAttribute('rel', 'canonical');
            document.head.appendChild(canonical);
        }
        canonical.setAttribute('href', window.location.origin + window.location.pathname + window.location.search);

        const schemaContainer = document.getElementById('schema-json');
        if (schemaData) {
            schemaContainer.textContent = JSON.stringify(schemaData);
        } else {
            schemaContainer.textContent = JSON.stringify({
                "@context": "https://schema.org",
                "@type": "WebSite",
                "name": "KomikUp",
                "url": "https://www.komikup.com/",
                "potentialAction": {
                    "@type": "SearchAction",
                    "target": "https://www.komikup.com/?q={search_term_string}",
                    "query-input": "required name=search_term_string"
                }
            });
        }
    }

    function cleanEndpoint(url) {
        if (!url) return "";
        if (url.startsWith("http")) {
            try { return new URL(url).pathname; } catch (e) { return url; }
        }
        return url.startsWith("/") ? url : "/" + url;
    }

    function isBlockedComic(item) {
        if (!item) return false;
        const title = (item.title || '').toLowerCase();
        const endpoint = (item.endpoint || item.slug || '').toLowerCase();

        return KCOPA_REDIRECT_COMICS.some(blocked => {
            const key = blocked.keyword.toLowerCase();
            const keyNoDash = key.replace(/-/g, ' ');
            return endpoint.includes(key) || title.includes(key) || title.includes(keyNoDash);
        });
    }

    async function fetchDetail(endpoint) {
        const data = await getData(`/comic/info${endpoint}`);
        if (data && data.data) {
            const info = data.data;
            const chapters = info.chapter_list || info.chapters || [];
            
            let baseSlug = endpoint.replace(/^\/|\/$/g, '').split('/').pop();
            if (baseSlug) {
                localStorage.setItem('cached_chapters_' + baseSlug, JSON.stringify(chapters));
            }
            sessionStorage.setItem('cachedChapters', JSON.stringify(chapters));
            sessionStorage.setItem('currentComicThumb', info.thumbnail);
            sessionStorage.setItem('currentComicTitle', info.title);
            sessionStorage.setItem('currentComicId', endpoint);
            
            const cleanDesc = (info.description || "").replace(/"/g, "'").slice(0, 150);
            const seoTitle = `Baca Komik ${info.title} Sub Indo - KomikUp`;
            const seoDesc = `Baca Komik ${info.title} Bahasa Indonesia gratis dan lengkap. ${cleanDesc}...`;

            const schemaComic = {
                "@context": "https://schema.org",
                "@type": "Book",
                "name": info.title,
                "author": {
                    "@type": "Person",
                    "name": info.author || "Unknown"
                },
                "image": info.thumbnail,
                "description": cleanDesc,
                "genre": info.genre ? info.genre : "Comic"
            };

            updateSEO(seoTitle, seoDesc, info.thumbnail, schemaComic);

    let cachedTopUsers = null;

    const LEADERBOARD_CACHE_DURATION = 60 * 60 * 1000; 

    async function loadTopUsers() {
        const listContainer = document.getElementById('bottomTopList');
        if (!listContainer) return;

        // 1. Cek memory RAM browser (0 Read Firestore)
        if (cachedTopUsers && cachedTopUsers.length > 0) {
            renderTopUsersList(cachedTopUsers);
            return;
        }

        listContainer.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#888; padding: 14px; font-size: 12px;">Memuat peringkat pembaca...</p>`;

        await initFirebase();
        if (!db) {
            listContainer.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#888; padding: 14px; font-size: 12px;">Layanan peringkat sedang offline.</p>`;
            return;
        }

        let doc = null;
        try {
            const cacheDocRef = db.collection('leaderboard').doc('top_users');
            doc = await cacheDocRef.get(); // Cukup 1 Read untuk ribuan user
            const now = Date.now();

            // Cek validitas dokumen cache di Firestore (< 1 jam)
            if (doc.exists && doc.data().list && (now - (doc.data().updatedAt || 0) < LEADERBOARD_CACHE_DURATION)) {
                cachedTopUsers = doc.data().list;
                renderTopUsersList(cachedTopUsers);
                return;
            }

            // 2. Jika cache belum ada / sudah kedaluwarsa, ambil 10 user teratas dari koleksi users
            const snapshot = await db.collection('users')
                .orderBy('chaptersRead', 'desc')
                .limit(10)
                .get();

            if (snapshot.empty) {
                listContainer.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#888; padding: 14px; font-size: 12px;">Belum ada data peringkat pembaca.</p>`;
                return;
            }

            const freshList = [];
            snapshot.forEach(d => {
                const u = d.data();
                freshList.push({
                    displayName: (u.displayName && u.displayName.trim() !== '') ? u.displayName.trim() : 'Anonim',
                    chaptersRead: Number(u.chaptersRead) || 0,
                    level: Number(u.level) || 1,
                    photoURL: (u.photoURL && typeof u.photoURL === 'string') ? u.photoURL.trim() : ''
                });
            });

            // 3. Simpan ke dokumen agregat leaderboard/top_users
            await cacheDocRef.set({
                list: freshList,
                updatedAt: now
            });

            cachedTopUsers = freshList;
            renderTopUsersList(cachedTopUsers);

        } catch (err) {
            console.warn("Gagal memuat ranking user:", err);
            // Fallback: Tampilkan cache lama jika ada saat terjadi kendala jaringan/write
            if (doc && doc.exists && doc.data().list) {
                renderTopUsersList(doc.data().list);
            } else {
                listContainer.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#888; padding: 14px; font-size: 12px;">Gagal memuat data peringkat.</p>`;
            }
        }
    }

    async function fetchChapter(endpoint) {

        let data = await getData(`/comic/chapter${cleanEp}`);

        // 2. Fallback: Jika gagal atau gambar kosong, coba variasi endpoint dengan/tanpa /baca/
        if (!data || !data.data || !data.data.image || data.data.image.length === 0) {
            let fallbackEp = cleanEp;
            
            if (cleanEp.startsWith('/baca/')) {
                // Jika sudah ada /baca/, coba versi tanpa /baca/
                fallbackEp = cleanEp.replace(/^\/baca/, '');
            } else {
                // Jika belum ada /baca/, sisipkan /baca di depannya
                fallbackEp = '/baca' + (cleanEp.startsWith('/') ? cleanEp : '/' + cleanEp);
            }

            console.warn(`[Fallback Chapter] Mencoba rute alternatif: /comic/chapter${fallbackEp}`);
            const fallbackData = await getData(`/comic/chapter${fallbackEp}`);
            
            if (fallbackData && fallbackData.data) {

    async function ensureChaptersCached(currentEndpoint) {
        const cleanEp = cleanEndpoint(currentEndpoint); 
        let raw = cleanEp.replace(/(-chapter-.*|\/chapter-.*)/i, '').replace(/^\/|\/$/g, '');
        let baseSlug = raw.split('/').pop();

        if (!baseSlug) return;

        let storageKey = 'cached_chapters_' + baseSlug;
        let cached = JSON.parse(localStorage.getItem(storageKey) || '[]');
        
        if (cached.length > 0) {
            sessionStorage.setItem('cachedChapters', JSON.stringify(cached));
            return; 
        }

        const targetUrl = `/comic/info/manga/${baseSlug}/`;

        try {
            let res = null;
            try {
                res = await fetch(`${PRIMARY_API}${targetUrl}`);
                if (!res.ok) throw new Error(`Primary status: ${res.status}`);
            } catch (errPrimary) {
                res = await fetch(`${FALLBACK_API}${targetUrl}`);
                if (!res.ok) throw new Error(`Fallback status: ${res.status}`);
            }

            const infoData = await res.json();
            const rawChapters = infoData?.data?.chapter_list || infoData?.data?.chapters || [];

            if (rawChapters.length > 0) {
                localStorage.setItem(storageKey, JSON.stringify(rawChapters));
                sessionStorage.setItem('cachedChapters', JSON.stringify(rawChapters));
                sessionStorage.setItem('currentComicTitle', infoData.data.title || '');
                sessionStorage.setItem('currentComicThumb', infoData.data.thumbnail || '');
            }
        } catch (err) {
            console.warn("Gagal ambil info komik:", err);
        }
    }

    function initChapterLazyLoad() {
        const lazyImages = document.querySelectorAll('.lazy-chapter');

        const imageObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    const realSrc = img.getAttribute('data-src');

                    if (realSrc) {
                        img.decoding = "async";
                        img.src = realSrc;
                        img.removeAttribute('data-src');
                    }

                    observer.unobserve(img);
                }
            });
        }, {
            root: null,
            rootMargin: "0px 0px 3000px 0px", 
            threshold: 0
        });

        lazyImages.forEach(image => imageObserver.observe(image));
    }

    function updateNavigation(currentEp) {
        const cleanCurrent = cleanEndpoint(currentEp).replace(/^\/|\/$/g, "").toLowerCase();
        
        let chapters = JSON.parse(sessionStorage.getItem('cachedChapters') || '[]');
        if (chapters.length === 0) {
            let baseSlug = cleanCurrent.replace(/(-chapter-.*|\/chapter-.*)/i, '').split('/').pop();
            chapters = JSON.parse(localStorage.getItem('cached_chapters_' + baseSlug) || '[]');
        }

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const sheetContent = document.getElementById('sheetContent');
        const footerCount = document.getElementById('footerChapterCount');

        if (chapters.length === 0) {
            if (prevBtn) { prevBtn.style.opacity = "0.3"; prevBtn.onclick = null; }
            if (nextBtn) { nextBtn.style.opacity = "0.3"; nextBtn.onclick = null; }
            if (footerCount) footerCount.innerText = "Daftar Chapter";
            if (sheetContent) {
                sheetContent.innerHTML = `<p style="text-align:center; padding:24px; color:#888; font-size:13px;">Daftar chapter belum tersedia.</p>`;
            }
            return;
        }

        const extractChapterKey = (url) => {
            const match = url.match(/chapter-(\d+[\.-]?\d*)/i);
            if (match) return match[1];
            const parts = url.replace(/^\/|\/$/g, "").split('/');
            return parts[parts.length - 1].toLowerCase();
        };

        const currentKey = extractChapterKey(cleanCurrent);
        
        const idx = chapters.findIndex(c => {
            const chEp = cleanEndpoint(c.endpoint || '').replace(/^\/|\/$/g, "").toLowerCase();
            return chEp === cleanCurrent || extractChapterKey(chEp) === currentKey;
        });

        if (idx !== -1) {
            let isLatestOnTop = true;
            if (chapters.length > 1) {
                const firstNum = parseFloat(chapters[0].endpoint.match(/chapter-(\d+[\.-]?\d*)/i)?.[1] || 0);
                const lastNum = parseFloat(chapters[chapters.length - 1].endpoint.match(/chapter-(\d+[\.-]?\d*)/i)?.[1] || 0);
                if (firstNum < lastNum) isLatestOnTop = false;
            }

            const nextIdx = isLatestOnTop ? idx - 1 : idx + 1;
            const prevIdx = isLatestOnTop ? idx + 1 : idx - 1;

            if (prevIdx >= 0 && prevIdx < chapters.length) {
                prevBtn.onclick = () => location.href = `?page=read&ep=${cleanEndpoint(chapters[prevIdx].endpoint)}`;
                prevBtn.style.opacity = "1";
            } else {
                prevBtn.style.opacity = "0.3";
                prevBtn.onclick = null;
            }

            if (nextIdx >= 0 && nextIdx < chapters.length) {
                nextBtn.onclick = () => location.href = `?page=read&ep=${cleanEndpoint(chapters[nextIdx].endpoint)}`;
                nextBtn.style.opacity = "1";
            } else {
                nextBtn.style.opacity = "0.3";
                nextBtn.onclick = null;
            }

            const activeChapterName = chapters[idx].name || chapters[idx].title || `Ch. ${currentKey}`;
            if (footerCount) {
                footerCount.innerText = activeChapterName;
            }
        } else {
            if (prevBtn) { prevBtn.style.opacity = "0.3"; prevBtn.onclick = null; }
            if (nextBtn) { nextBtn.style.opacity = "0.3"; nextBtn.onclick = null; }
            if (footerCount) footerCount.innerText = `Pilih (${chapters.length})`;
        }

        const sheetTitle = document.getElementById('sheetChapterHeaderTitle');
        if (sheetTitle) {
            sheetTitle.innerText = `Pilih Chapter (${chapters.length} Tersedia)`;
        }

        const readHistory = getStorage('komikup_history');
        if (sheetContent) {
            sheetContent.innerHTML = chapters.map(ch => {
                const chEp = cleanEndpoint(ch.endpoint);
                const isCurrent = (idx !== -1 && ch.endpoint === chapters[idx].endpoint);

const KCOPA_REDIRECT_COMICS = [
    { keyword: 'nano-machine' },
    { keyword: 'solo-max-level-newbie' },
    { keyword: 'villain-to-kill' },
    { keyword: 'the-world-after-the-fall' },
    { keyword: 'regressor-of-the-fallen-family' },

    { keyword: 'return-of-the-mad-demon' },
    { keyword: 'absolute-sword-sense' },
    { keyword: 'absolute-regression' }
];

function getKcopaTarget() {
    const currentUrl = decodeURIComponent(window.location.href.toLowerCase());
    for (let i = 0; i < KCOPA_REDIRECT_COMICS.length; i++) {
        const key = KCOPA_REDIRECT_COMICS[i].keyword.toLowerCase();
        const keyNoDash = key.replace(/-/g, ' ');
        if (currentUrl.indexOf(key) !== -1 || currentUrl.indexOf(keyNoDash) !== -1) {
            return KCOPA_REDIRECT_COMICS[i];
        }
    }
    return null;
}

const OFFERWALL_LINKS = [
    'https://s.shopee.co.id/LlMjYYKka',
    'https://s.shopee.co.id/LlMjYYKka'
];

const ACCESS_DURATION = 0.5 * 60 * 60 * 1000;
const ACCESS_STORAGE_KEY = 'komikup_pass_time';
const OFFERWALL_INDEX_KEY = 'komikup_offerwall_link_index';

function hasValidAccess() {
    if (getKcopaTarget() !== null) return false;
    const accessTime = localStorage.getItem(ACCESS_STORAGE_KEY);
    if (!accessTime) return false;
    return (Date.now() - parseInt(accessTime, 10)) < ACCESS_DURATION;
}

function getNextOfferwallTarget() {
    let lastIndex = parseInt(localStorage.getItem(OFFERWALL_INDEX_KEY));
    if (isNaN(lastIndex)) {
        lastIndex = 0;
    } else {
        lastIndex = (lastIndex + 1) % OFFERWALL_LINKS.length;
    }
    return {
        url: OFFERWALL_LINKS[lastIndex],
        index: lastIndex
    };
}

function unlockAccessAndOpen(passedEp = '') {
    const target = getNextOfferwallTarget();

    localStorage.setItem(ACCESS_STORAGE_KEY, Date.now());
    localStorage.setItem(OFFERWALL_INDEX_KEY, target.index);

    try {
        if (typeof Histats_variables === 'undefined') window.Histats_variables = [];
        window.Histats_variables.push("KomikUp_Offerwall_Unlock", target.index.toString());
        if (window._Hasync) window._Hasync.push(['Histats.track_hits', '']);
    } catch (e) {}

    window.open(target.url, '_blank');
    
    const locker = document.getElementById('offerwallLocker');
    const readerBox = document.getElementById('readerContainerBox');
    if (locker) locker.style.display = 'none';
    if (readerBox) {
        readerBox.style.display = 'block';
        if (typeof initChapterLazyLoad === 'function') initChapterLazyLoad();
    }

    const params = new URLSearchParams(window.location.search);
    const activeEp = passedEp || params.get('ep') || '';
    if (activeEp) {
        ensureChaptersCached(activeEp).then(() => {
            updateNavigation(activeEp);
        });
    }
}

function applyKcopaLock() {
    const kcopaItem = getKcopaTarget();
    const overlay = document.getElementById('kcopa-block-overlay');

    if (kcopaItem) {
        document.title = "404 Halaman Tidak Ditemukan - KomikUp";

        const contentArea = document.getElementById('content-area');
        if (contentArea) contentArea.innerHTML = '';

        const readerBox = document.getElementById('readerContainerBox');
        if (readerBox) {
            readerBox.innerHTML = '';
            readerBox.style.display = 'none';
        }

        const offerwall = document.getElementById('offerwallLocker');
        if (offerwall) offerwall.style.display = 'none';

        if (overlay) overlay.style.display = 'flex';
        return true;
    } else {
        if (overlay) overlay.style.display = 'none';
        return false;
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', applyKcopaLock);
} else {
    applyKcopaLock();
}
</script>
