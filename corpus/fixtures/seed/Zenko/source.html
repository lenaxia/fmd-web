 життя, яке здається звичайним і нудним у порівнянні з минулим, змирившись із тим, що їхня пригода скінчилася.\\n\\nЗрештою, детективка уже мертва.\",\"coverImg\":\"a6eef79f-135a-415a-8f66-b9e3c89c7f56\",\"coverFileId\":\"558a1f52-c06e-4e0a-93b0-614f630504b3\",\"bgImg\":\"852a7805-bbc6-42d4-acfe-c2862ebd84ae\",\"bgFileId\":\"4a0711f9-424e-4343-b0f9-95695f9e6dee\",\"status\":\"ONGOING\",\"translationStatus\":\"ONGOING\",\"releaseYear\":2019,\"category\":\"RANOBE\",\"originalUrl\":null,\"ageLimit\":0,\"authorId\":33102,\"viewsCount\":16,\"likesCount\":11,\"trendingScore\":0,\"updatedAt\":1792786847,\"totalChapterCount\":540,\"lastChapterCreatedAt\":1793879354,\"deletedAt\":null,\"visibilityStatus\":\"VISIBLE\",\"activeTeam\":{\"createdAt\":1747914268,\"id\":1066,\"avatar\":\"5e87c489-cdb2-4b98-b286-725a9c6ee69b\",\"avatarFileId\":\"b8110716-45bf-469d-b2c0-c2105a150493\",\"description\":\"Ласкаво просимо до Petite Pages!\\n\\nТут збираються любителі тайтлів, де головний герой спочатку найслабший, а потім розносить усіх демонів на шматки; де регресори намагаються розібратися у своїх почуттях до сліпої святої, а пригоди Артура розривають серце.\\n\\nЗараз ми занурилися в детективний депресняк та естетику разом із «Детективка вже мертва».\\n\\nЯкщо шукаєш фановий переклад, зроблений із душею та любов'ю до деталей — ти за адресою. Чайник уже кипить, відкривай новий розділ! ☕📚\",\"isModerated\":true,\"name\":\"Petite Pages\",\"ownerId\":33102,\"contactUsLink\":\"\",\"totalThanks\":34,\"credits\":\"25.5\",\"links\":[{\"link\":\"https://t.me/Petite_Pages\",\"type\":\"TELEGRAM\",\"title\":\"\",\"isBlank\":true}],\"bgImg\":\"c3b445f7-a407-489a-9b68-62dedcd65569\",\"bgFileId\":\"5c9a625f-94a2-4dbd-a004-22ab22106ff2\",\"isPDFDisabled\":false,\"visibilityStatus\":\"VISIBLE\"},\"chaptersCount\":25,\"bookmarkName\":null},{\"createdAt\":1791539208,\"id\":4724,\"name\":\"Квітка танцює, а вітер співа\",\"originalName\":\"꽃은 춤추고 바람은 노래한다\",\"engName\":\"The Flower Dances and the Wind Sings\",\"description\":\"Ерселла прожила розкішне життя, якому заздрили всі, але передчасно померла від хвороби.\\nПеред смертю вона шкодувала лише про одне — що так і не стала для свого сина справжньою матір’ю.\\nТа з незрозумілих причин вона повернулася на три роки в минуле.\\nОтримавши другий шанс, Ерселла твердо вирішує:\\n\\\"Цього разу я неодмінно стану турботливою матір’ю\\\"\\nАле чи не запізно?..\\n— Коли ви раптом починаєте так поводитися, мені стає лише ніяково.\\nСин раз по раз відштовхує її. І тоді Ерселла усвідомлює, що її шлюб, який до повернення здавався цілком щасливим, насправді зовсім не такий…\",\"coverImg\":\"4a707c15-3602-4aa2-bc8e-3c40b4a80673\",\"coverFileId\":\"6d9cd9be-0cef-44e1-8350-1c259914e90b\",\"bgImg\":\"94300ce6-a866-4304-9ab6-df9f0bffac49\",\"bgFileId\":\"d6704cec-dd37-4acc-b5dd-128e980858f6\",\"status\":\"FINISHED\",\"translationStatus\":\"ONGOING\",\"releaseYear\":2020,\"category\":\"RANOBE\",\"originalUrl\":null,\"ageLimit\":0,\"authorId\":60796,\"viewsCount\":104,\"likesCount\":65,\"trendingScore\":0,\"updatedAt\":1791539208,\"totalChapterCount\":238,\"lastChapterCreatedAt\":1793812055,\"deletedAt\":null,\"visibilityStatus\":\"VISIBLE\",\"activeTeam\":{\"createdAt\":1779745584,\"id\":1626,\"avatar\":\"df3b9b51-9a20-4a27-b9ea-13e9a4b84178\",\"avatarFileId\":\"d405011b-ab77-460e-b251-2eac138d7dce\",\"description\":\"Твоя провідна закладка у безмежному світі історій\",\"isModerated\":true,\"name\":\"Шіорі\",\"ownerId\":60796,\"contactUsLink\":\"\",\"totalThanks\":0,\"credits\":\"0\",\"links\":[{\"link\":\"https://t.me/shioritranslate\",\"type\":\"TELEGRAM\",\"title\":\"\",\"isBlank\":true},{\"link\":\"https://www.privat24.ua/send/j80pl\",\"type\":\"DONATE\",\"title\":\"\",\"isBlank\":true}],\"bgImg\":\"c3e6a778-3978-423b-9d38-aa602b714663\",\"bgFileId\":\"8c48a529-85a1-478a-81e7-abf0df88a9a5\",\"isPDFDisabled\":false,\"visibilityStatus\":\"VISIBLE\"},\"chaptersCount\":11,\"bookmarkName\":null},{\"createdAt\":1793384658,\"id\":4796,\
