# E2E override (test profile) — `scripts/e2e.sh` runs exactly:
#
#   docker compose -f docker/compose.yml -f docker/compose.e2e.yml \
#     --profile test up --build
#
# Adds the LOCAL MOCK UPSTREAM (node:http fixture container — no custom
# image; the base image is digest-pinned, docs/docker-pinning.md) and
# retargets the app at it. The app boots with the D20 auto-bootstrap:
# empty data volume → module sync (mock codeload zipball of the fixture
# lua tree) → catalog sync (mock commits API + crafted .7z fixture) —
# all OFFLINE: fixtures + mock upstream only.
#
# The fixture upstream tree is produced by `e2e/prep.mjs` and bind-mounted
# into the mock container (fixture catalogs + zipball + recorded site
# pages); the raw fixture lua tree is mounted alongside for provenance.

services:
  app:
    restart: "no"
    stop_grace_period: 30s
    depends_on:
      e2e-mock:
        condition: service_healthy
    env_file:
      # Generated by e2e/prep.mjs (fixture constants + mock URLs).
      - ../e2e/.tmp/fixtures/upstream/e2e.env
    healthcheck:
      # Faster cadence than the base image default — the e2e gate keys
      # on /readyz (bootstrap-gated), /healthz stays the liveness probe.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||'3000')+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      start_period: 90s
      retries: 5

  e2e-mock:
    # Digest-pinned base (DESIGN §3); see docs/docker-pinning.md.
    image: node:22.14.0-bookworm-slim@sha256:1c18d9ab3af4585870b92e4dbc5cac5a0dc77dd13df1a5905cea89fc720eb05b
    profiles: ["test"]
    restart: "no"
    init: true
    working_dir: /srv
    command: ["node", "/srv/mock-upstream.mjs", "--root", "/srv/upstream", "--port", "8081"]
    volumes:
      - ../e2e/mock-upstream.mjs:/srv/mock-upstream.mjs:ro
      # Fixture upstream tree: crafted catalog .7z, fixture zipball,
      # commits JSON, recorded manga page (built by e2e/prep.mjs).
      - ../e2e/.tmp/fixtures/upstream:/srv/upstream:ro
      # The raw fixture lua tree the zipball was built from (provenance).
      - ../e2e/fixtures/lua:/srv/fixtures-lua:ro
    ports:
      # Host access for the e2e script's mock request-log assertion.
      - "127.0.0.1:8091:8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 10
